name: Bug Report
description: Report a bug, format edge case, or UI issue in EVERYTHING
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please **never** attach private or sensitive user files.
  - type: dropdown
    id: studio
    attributes:
      label: Workspace Studio / Area
      options:
        - Convert Anything
        - PDF & Document Lab
        - Image Studio
        - Audio & Video Studio
        - Design Studio
        - Office & Archive Studio
        - OCR Studio
        - Developer Toolbox
        - Privacy & Utilities
        - AI Command Studio
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open ...
        2. Select sample/file type ...
        3. Observe error ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: e.g., Chrome 131 on macOS / Safari 18 on iOS
